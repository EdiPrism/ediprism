name: Feature Request
description: Suggest an offline ASC X12, UN/EDIFACT, 999/997, partner schema, or HIPAA workflow enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: EDI / Healthcare / Supply-Chain Workflow Problem
      placeholder: Describe the X12 transaction set, UN/EDIFACT message, or offline validation workflow you want streamlined.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Capability
    validations:
      required: true
